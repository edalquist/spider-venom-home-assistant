set_target_temperature:
  name: Set target temperature
  description: Set the Spider Grills Venom target cooking temperature.
  target:
    device:
      integration: spider_venom
    entity:
      integration: spider_venom
  fields:
    temperature:
      name: Temperature
      description: Target temperature in Fahrenheit.
      required: true
      selector:
        number:
          min: 150
          max: 550
          step: 1
          mode: box
          unit_of_measurement: "°F"
    thing_name:
      name: Thing name
      description: AWS IoT thing name. Optional when using a target or a single Venom.
      required: false
      selector:
        text:
